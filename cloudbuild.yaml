# Build config for the Cloud Build trigger `triage-interaction-ingest` (global,
# GitHub push to ^main$). Build, push, deploy.
#
# The Deploy step stamps the labels that attach the service to its trigger
# (gcb-trigger-id is what makes the Cloud Run console show the source repository).
# _TRIGGER_ID is a user substitution set on the trigger, because the trigger id is
# not a default Cloud Build substitution.
#
# Env vars live on the Cloud Run revision (gcloud run services update
# --update-env-vars); `gcloud run deploy` with --image keeps them. Nothing
# credential-bearing belongs in this file.
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/triage-interaction-ingest:$COMMIT_SHA
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/triage-interaction-ingest:$COMMIT_SHA
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - triage-interaction-ingest
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/triage-interaction-ingest:$COMMIT_SHA
      - --region=us-east1
      - --no-allow-unauthenticated
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID,gcb-trigger-region=global
      - --quiet
images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/triage-interaction-ingest:$COMMIT_SHA
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - triage-interaction-ingest
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
