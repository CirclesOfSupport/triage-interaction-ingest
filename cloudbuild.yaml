# Build config for the Cloud Build trigger `triage-interaction-ingest` (global,
# GitHub push to ^main$). Build, push, deploy. Env vars live on the Cloud Run
# revision (gcloud run services update --update-env-vars); `gcloud run deploy`
# with only --image keeps them.
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/triage-interaction-ingest/triage-interaction-ingest:$COMMIT_SHA
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/triage-interaction-ingest/triage-interaction-ingest:$COMMIT_SHA
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - triage-interaction-ingest
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/triage-interaction-ingest/triage-interaction-ingest:$COMMIT_SHA
      - --region=us-east1
      - --no-allow-unauthenticated
      - --quiet
images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/triage-interaction-ingest/triage-interaction-ingest:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
